; WT32-SC01 Plus (ESP32-S3-WROVER, 3.5" ST7796 @ 8-bit i80, Touch FT6336U)
; PlatformIO kennt das Board nicht offiziell -> DevKitC-1 als Basis + Overrides.

[env:wt32-sc01-plus]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM (vor dem ersten Flashen mit esptool verifiziert) ---
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions  = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

; --- Beispielrezept in die Firmware einbetten; wird auf eine leere SD-Karte
;     geschrieben (siehe src/sd_card.cpp). Symbolname leitet sich aus dem
;     Pfad ab: _binary_sd_rezepte_bauernbrot_json_start ---
board_build.embed_txtfiles = sd/rezepte/bauernbrot.json

; --- Serielle Verbindung laeuft ueber den nativen USB des S3 (/dev/ttyACM0) ---
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DLGFX_USE_V1

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ^9.2.0
    bblanchon/ArduinoJson @ ^7.4.0
